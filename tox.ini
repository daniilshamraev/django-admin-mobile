[tox]
envlist = py312-django{42,52,60}
isolated_build = true

[testenv]
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    pytest>=8.3
    pytest-django>=4.9
    ruff>=0.8
    docutils>=0.20
commands =
    ruff check .
    pytest -m "not playwright" {posargs}
